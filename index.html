<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SharpLines NCAAB</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; background:#0f172a; color:white; margin:0; padding:16px;}
h1 { text-align:center; }
.card {
  background:#1e293b;
  padding:14px;
  border-radius:12px;
  margin-bottom:14px;
}
.team { font-weight:bold; font-size:16px; }
.small { font-size:12px; opacity:.8 }
.edge { margin-top:8px; padding:6px; border-radius:8px; font-weight:bold;}
.sharp { background:#065f46; color:#10ff99;}
.flat { background:#334155;}
.injury { font-size:12px; margin-top:4px; opacity:.85;}
</style>
</head>

<body>
<h1>SharpLines NCAAB</h1>
<div id="games"></div>

<script>
const RAPID_KEY = "5fbedb44c69f8d0ffc9e58ad88de5b0b709b37d68647e20bb28986d9d8edfca8";
const SPORT_ID = 5;
const today = new Date().toISOString().split('T')[0];

async function fetchGames() {
  const res = await fetch(
    `https://therundown-therundown-v1.p.rapidapi.com/sports/${SPORT_ID}/events/${today}`,
    {
      headers:{
        "x-rapidapi-host":"therundown-therundown-v1.p.rapidapi.com",
        "x-rapidapi-key":RAPID_KEY
      }
    }
  );
  const data = await res.json();
  return data.events || [];
}

function impliedProb(odds){
  if(!odds) return 0;
  if(odds > 0) return 100/(odds+100);
  return -odds/(-odds+100);
}

// Simple tempo + efficiency based heuristic model
function modelProb(homeRank, awayRank){
  if(!homeRank || !awayRank) return .5;
  const diff = awayRank - homeRank;
  let prob = .5 + (diff * 0.0025);
  return Math.max(.35, Math.min(.65, prob));
}

async function fetchEspn(team){
  try{
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/teams/${team}`);
    return await res.json();
  }catch{ return null; }
}

async function fetchInjuries(team){
  try{
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/teams/${team}/injuries`);
    const data = await res.json();
    return data.items || [];
  }catch{ return []; }
}

function sharpFlag(edge){
  if(edge >= .03) return "sharp";
  return "flat";
}

async function build(){
  const games = await fetchGames();
  const container = document.getElementById("games");
  container.innerHTML = "";

  for(const g of games){
    const home = g.teams_normalized.find(t=>t.is_home);
    const away = g.teams_normalized.find(t=>!t.is_home);

    const book = g.lines?.[0];
    if(!book) continue;

    const homeOdds = book.moneyline?.home;
    const awayOdds = book.moneyline?.away;

    const homeImp = impliedProb(homeOdds);
    const awayImp = impliedProb(awayOdds);

    const homeRank = home.rank || 100;
    const awayRank = away.rank || 100;

    const homeModel = modelProb(homeRank, awayRank);
    const awayModel = 1 - homeModel;

    const homeEdge = homeModel - homeImp;
    const awayEdge = awayModel - awayImp;

    const espnHome = await fetchEspn(home.team_id);
    const espnAway = await fetchEspn(away.team_id);

    const homeInj = await fetchInjuries(home.team_id);
    const awayInj = await fetchInjuries(away.team_id);

    const card = document.createElement("div");
    card.className="card";

    card.innerHTML = `
      <div class="team">${away.name} @ ${home.name}</div>
      <div class="small">Spread: ${book.spread?.point || "N/A"} | Total: ${book.total?.points || "N/A"}</div>

      <div class="edge ${sharpFlag(homeEdge)}">
        ${home.name} ML ${homeOdds} | Implied ${(homeImp*100).toFixed(1)}% 
        | Model ${(homeModel*100).toFixed(1)}% 
        | Edge ${(homeEdge*100).toFixed(2)}%
      </div>

      <div class="edge ${sharpFlag(awayEdge)}">
        ${away.name} ML ${awayOdds} | Implied ${(awayImp*100).toFixed(1)}% 
        | Model ${(awayModel*100).toFixed(1)}% 
        | Edge ${(awayEdge*100).toFixed(2)}%
      </div>

      <div class="injury">
        <strong>${home.name} Injuries:</strong>
        ${homeInj.length ? homeInj.map(i=>i.athlete.displayName+" ("+i.status+")").join(", ") : "None"}
      </div>

      <div class="injury">
        <strong>${away.name} Injuries:</strong>
        ${awayInj.length ? awayInj.map(i=>i.athlete.displayName+" ("+i.status+")").join(", ") : "None"}
      </div>
    `;

    container.appendChild(card);
  }
}

build();
</script>
</body>
</html>
