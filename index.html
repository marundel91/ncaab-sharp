<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════

const RAPID_API_KEY = "5fbedb44c69f8d0ffc9e58ad88de5b0b709b37d68647e20bb28986d9d8edfca8";
const SPORT_ID = 5; // NCAAB
const AUTO_REFRESH_MS = 60000;
const PREFERRED_BOOKS = [3, 4, 11, 6, 8];

const $id = id => document.getElementById(id);

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════

function fmtOdds(n){ if(n==null)return '—'; return n>0?`+${n}`:`${n}`;}
function fmtSpread(n){ if(n==null)return '—'; return n>0?`+${n}`:`${n}`;}
function impliedProb(odds){
  if(!odds) return null;
  return odds < 0 ? (-odds)/(-odds+100) : 100/(odds+100);
}
function percent(n){ return n? (n*100).toFixed(1)+'%':'—'; }
function formatTime(iso){ return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ═══════════════════════════════════════════════════════════════
// FETCH RUNDOWN ODDS
// ═══════════════════════════════════════════════════════════════

async function fetchOdds(){
  const url=`https://therundown-therundown-v1.p.rapidapi.com/sports/${SPORT_ID}/events/${todayStr()}?include=all_periods`;
  const res=await fetch(url,{
    headers:{
      'x-rapidapi-host':'therundown-therundown-v1.p.rapidapi.com',
      'x-rapidapi-key':RAPID_API_KEY
    }
  });
  if(!res.ok) throw new Error("Odds API failed");
  return res.json();
}

// ═══════════════════════════════════════════════════════════════
// FETCH ESPN STATS + INJURIES
// ═══════════════════════════════════════════════════════════════

async function fetchESPN(){
  const url=`https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard`;
  const res=await fetch(url);
  if(!res.ok) return null;
  return res.json();
}

// ═══════════════════════════════════════════════════════════════
// EDGE CALCULATION
// ═══════════════════════════════════════════════════════════════

function calculateEdge(bestOdds, allOdds){
  if(!bestOdds) return null;
  const bestProb = impliedProb(bestOdds);
  if(!bestProb) return null;

  const probs = allOdds.map(o=>impliedProb(o)).filter(p=>p);
  if(!probs.length) return null;

  const consensus = probs.reduce((a,b)=>a+b,0)/probs.length;
  return bestProb - consensus;
}

// ═══════════════════════════════════════════════════════════════
// MAIN LOAD
// ═══════════════════════════════════════════════════════════════

async function loadAll(){

  const container=$id('gamesContainer');
  container.innerHTML="<div style='padding:20px'>Loading...</div>";

  try{
    const [oddsData, espnData] = await Promise.all([
      fetchOdds(),
      fetchESPN()
    ]);

    const events=oddsData.events||[];
    const espnEvents=espnData?.events||[];

    container.innerHTML='';
    const grid=document.createElement('div');
    grid.className='games-grid';
    container.appendChild(grid);

    events.forEach(event=>{

      const teams=event.teams||[];
      const awayTeam=teams.find(t=>t.is_away)||teams[0];
      const homeTeam=teams.find(t=>t.is_home)||teams[1];

      const away=awayTeam?.full_name||awayTeam?.name;
      const home=homeTeam?.full_name||homeTeam?.name;

      if(!away||!home) return;

      const lines=event.lines||{};
      const bookLines=Object.values(lines);

      if(!bookLines.length) return;

      const spreads=bookLines.map(b=>b.spread?.point_spread_away).filter(x=>x!=null);
      const moneylines=bookLines.map(b=>b.moneyline?.moneyline_away).filter(x=>x!=null);

      const bestSpread=Math.max(...spreads);
      const bestML=Math.max(...moneylines);

      const spreadEdge=calculateEdge(bestSpread,spreads);
      const mlEdge=calculateEdge(bestML,moneylines);

      const sharpFlag = (spreadEdge>0.03 || mlEdge>0.03);

      // ESPN MATCH
      const espnMatch = espnEvents.find(e =>
        e.name.includes(away.split(" ")[0]) &&
        e.name.includes(home.split(" ")[0])
      );

      let injuriesHTML='';
      if(espnMatch?.competitions?.[0]?.competitors){
        const comps=espnMatch.competitions[0].competitors;
        comps.forEach(c=>{
          if(c.injuries?.length){
            injuriesHTML+=`<div style="font-size:12px;color:#ff5555">
              ${c.team.displayName} Injuries: ${c.injuries.map(i=>i.athlete.displayName).join(", ")}
            </div>`;
          }
        });
      }

      const card=document.createElement('div');
      card.className='game-card';
      if(sharpFlag) card.style.border="2px solid gold";

      card.innerHTML=`
        <div class="card-top">
          <div>${away}</div>
          <div>@</div>
          <div>${home}</div>
        </div>

        <div class="odds-row">
          <div>
            Spread: ${fmtSpread(bestSpread)}
            <div>Edge: ${spreadEdge?percent(spreadEdge):'—'}</div>
          </div>

          <div>
            ML: ${fmtOdds(bestML)}
            <div>Edge: ${mlEdge?percent(mlEdge):'—'}</div>
          </div>
        </div>

        <div style="font-size:12px;color:#aaa">
          Implied Prob (ML): ${percent(impliedProb(bestML))}
        </div>

        ${injuriesHTML}
      `;

      grid.appendChild(card);
    });

  }catch(e){
    container.innerHTML="<div style='padding:20px;color:red'>Error loading data</div>";
  }
}

// AUTO REFRESH
loadAll();
setInterval(loadAll,AUTO_REFRESH_MS);

</script>
